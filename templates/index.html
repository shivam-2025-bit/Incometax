<!DOCTYPE html>
<html>
<head>
    <title>Tax Calculator</title>
</head>
<body>

<h2>Income Tax Calculator</h2>

<form action="/calculate" method="post">
    <label>Enter Salary:</label>
    <input type="number" name="salary" required>
    <button type="submit">Calculate</button>
</form>

{% if result %}
    <h3>{{ result }}</h3>
{% endif %}

</body>
</html>
